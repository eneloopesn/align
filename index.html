<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10140f">
  <title>Align 同聲翻譯</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1a2118"/>
          <rect x="6" y="8" width="8" height="16" rx="2" fill="#d6ff4a"/>
          <rect x="18" y="8" width="8" height="16" rx="2" fill="#f3f0e7"/>
        </svg>
        <div>
          <strong>ALIGN</strong>
          <span>同聲翻譯</span>
        </div>
      </div>
      <div class="status" id="status">
        <i></i>
        <span id="statusText">待命</span>
      </div>
    </header>

    <p class="banner" id="banner" hidden></p>
    <p class="sr" id="announcer" aria-live="polite"></p>

    <div class="workspace">
    <div class="main">
    <section class="stage" id="stage">
      <article class="pane" aria-labelledby="sourceHeading">
        <div class="pane-head">
          <span class="pane-tools">
            <span id="sourceHeading">原文</span>
            <span class="bars" id="bars" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          </span>
          <span class="lang-code" id="sourceCode">繁中</span>
        </div>
        <p class="ghost" id="sourceGhost">原文會顯示在這裡</p>
        <p class="caption" id="sourceText" hidden></p>
      </article>

      <div class="bridge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/>
          <path d="M13 6l6 6-6 6"/>
        </svg>
      </div>

      <article class="pane pane-target" aria-labelledby="targetHeading">
        <div class="pane-head">
          <span id="targetHeading">譯文</span>
          <span class="pane-tools">
            <span class="chip" id="latency" hidden></span>
            <span class="chip" id="pendingChip" hidden>翻譯中</span>
            <span class="lang-code" id="targetCode">EN</span>
            <button type="button" class="text-btn" id="copyBtn">複製譯文</button>
          </span>
        </div>
        <p class="ghost" id="targetGhost">譯文會跟著語音同步出現</p>
        <p class="caption" id="targetText" hidden></p>
      </article>
    </section>

    <div class="dock">
      <div class="langs">
        <label class="field">來源
          <select id="sourceLang" aria-label="來源語言"></select>
        </label>
        <button type="button" class="swap" id="swapBtn" aria-label="對調來源與目標語言">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 7h12l-3.5-3.5"/>
            <path d="M17 17H5l3.5 3.5"/>
          </svg>
        </button>
        <label class="field">目標
          <select id="targetLang" aria-label="目標語言"></select>
        </label>
      </div>

      <button type="button" class="mic" id="mic" aria-pressed="false">
        <span class="mic-orb" aria-hidden="true">
          <svg class="icon-mic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M6 11a6 6 0 0 0 12 0"/>
            <path d="M12 17v3.5"/>
            <path d="M8.5 20.5h7"/>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" width="26" height="26" hidden>
            <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
          </svg>
        </span>
        <span id="micLabel">開始聆聽</span>
      </button>

      <label class="speak-toggle">
        <input type="checkbox" id="autoSpeak" checked>
        自動朗讀譯文
      </label>
    </div>

    <p class="hint" id="hint">空白鍵開始或停止。朗讀譯文時會暫停收音，避免麥克風把譯文再聽進去。</p>
    </div>

    <aside class="log" aria-labelledby="logHeading">
      <div class="log-head">
        <h2 id="logHeading">對話紀錄</h2>
        <button type="button" class="text-btn" id="clearBtn">清除</button>
      </div>
      <p class="empty" id="emptyLog">說完的句子會出現在這裡，同一種語言排在同一欄。</p>
      <div id="history"></div>
    </aside>
    </div>

    <footer class="note">語音辨識請用 Chrome 或 Edge。直接開啟這個頁面即可使用。</footer>
  </div>
  <noscript>需要開啟 JavaScript 才能翻譯。</noscript>
  <script src="app.js"></script>
</body>
</html>
